[build-system]
requires = [
    "hatchling",
    "setuptools",
    "setuptools_scm[toml]>=6.0",
    "build",
]
build-backend = "hatchling.build"

[project]
name = "modernmetric"
authors = [
    {name = "Jason Nichols", email = "github@verinfast.com"},
]
description = "Calculate code metrics in various languages"
readme = "README.md"
license = "CC-BY-NC-4.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: Free for non-commercial use",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "chardet>=5.2.0",
    "httpx[http2]~=0.28.1",
    "pygments>=2.19.2",
    "pygments-tsx>=1.0.3",
    "pygount>=3.1.1",
    "cachehash>=1.1.4",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "black>=26.1.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0"
]

[project.scripts]
modernmetric = "modernmetric.__main__:main"
modernmetric-test = "test.test_self_scan:main"

[project.urls]
"Homepage" = "https://github.com/verinfast/modernmetric"
"Bug Tracker" = "https://github.com/verinfast/modernmetric/issues"
"Source" = "https://github.com/verinfast/modernmetric"

[tool.black]
line-length = 88
target-version = ['py311', 'py312', 'py313']
include = '\.pyi?$'
exclude = '''
(
    (
          ^/VERSION\.py$
        | ^/testfiles/big_python\.py$
        | ^/env/.*
    )
)
'''


[tool.setuptools.packages.find]
where = ["."]
include = ["modernmetric*", "test*"]

[tool.hatch.version]
path = "VERSION.py"
